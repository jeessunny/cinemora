name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Unsigned Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

      - name: Make gradlew Executable
        run: chmod +x android/gradlew

      - name: Run Unit Tests & Build Unsigned Release APK
        run: |
          cd android
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace

      - name: Locate & Rename Unsigned Release APK
        id: prepare_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No unsigned release APK found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          mkdir -p release_output
          TARGET_PATH="release_output/cinemora-release-unsigned.apk"
          cp "$APK_PATH" "$TARGET_PATH"
          (cd release_output && sha256sum cinemora-release-unsigned.apk > cinemora-release-unsigned.apk.sha256)
          echo "apk_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum_path=release_output/cinemora-release-unsigned.apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload Unsigned APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinemora-release-unsigned-apk
          path: |
            release_output/cinemora-release-unsigned.apk
            release_output/cinemora-release-unsigned.apk.sha256
          retention-days: 14

      - name: Create Draft GitHub Release (Unsigned Artifact)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_output/cinemora-release-unsigned.apk
            release_output/cinemora-release-unsigned.apk.sha256
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
